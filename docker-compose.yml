services:
  connector:
    build: .
    environment:
      WOOCOMMERCE_MODE: ${WOOCOMMERCE_MODE:-mock}
      WOOCOMMERCE_BASE_URL: ${WOOCOMMERCE_BASE_URL:-https://example.invalid}
      WOOCOMMERCE_CONSUMER_KEY: ${WOOCOMMERCE_CONSUMER_KEY:-}
      WOOCOMMERCE_CONSUMER_SECRET: ${WOOCOMMERCE_CONSUMER_SECRET:-}
      WOOCOMMERCE_TIMEOUT_SECONDS: ${WOOCOMMERCE_TIMEOUT_SECONDS:-10}
      WOOCOMMERCE_MAX_RETRIES: ${WOOCOMMERCE_MAX_RETRIES:-3}
      WOOCOMMERCE_BACKOFF_FACTOR: ${WOOCOMMERCE_BACKOFF_FACTOR:-0.5}
    stdin_open: true
    tty: true